name: Run V106 Streaming Audit
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v106-audit
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas pyarrow
      - name: Fetch sources
        run: |
          git clone --depth 1 https://github.com/cayao2012/ICT-bot.git ictbot
          git clone --depth 1 https://github.com/hindsight-finance/Silver-Bullet-AM-Session.git silver
          if command -v git-lfs >/dev/null 2>&1; then (cd silver && git lfs pull) || true; fi
          ls -lh silver/nq_1m.parquet
      - name: Run streaming live-safe audit
        run: python -u audit_v106_stream.py | tee v106_stream.log
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v106-stream-results
          path: |
            v106_stream.log
            v106_stream_summary.json
            v106_stream_trades.csv
          if-no-files-found: warn
