name: Run V106 Fast Live-Safe Audit
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v106-audit
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas pyarrow
      - name: Fetch sources
        run: |
          git clone --depth 1 https://github.com/cayao2012/ICT-bot.git ictbot
          git clone --depth 1 https://github.com/hindsight-finance/Silver-Bullet-AM-Session.git silver
          if command -v git-lfs >/dev/null 2>&1; then (cd silver && git lfs pull) || true; fi
          ls -lh silver/nq_1m.parquet
      - name: Apply live-safe acceleration
        run: |
          python - <<'PY'
          p='audit_v106.py'
          s=open(p).read()
          s=s.replace("KZ = [((7,30),(14,30))]", "KZ = [((8,0),(14,30))]")
          s=s.replace("for cursor in range(ds5+1,de5):\n            next_ns=", "kz_ds = next((ii for ii in range(ds5,de5) if (b5[ii]['hour'] > 8 or (b5[ii]['hour']==8 and b5[ii]['minute']>=0))), de5)\n        for cursor in range(kz_ds+1,de5):\n            if b5[cursor]['hour'] >= 15: break\n            next_ns=")
          s=s.replace("b1[b1_day_start:cutoff], ds5, cursor, d, liq, kz=KZ", "b1[b1_day_start:cutoff], kz_ds, cursor, d, liq, kz=KZ")
          open(p,'w').write(s)
          PY
          python -m py_compile audit_v106.py
      - name: Run independent live-safe audit
        run: python -u audit_v106.py | tee v106_fast.log
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v106-fast-results
          path: |
            v106_fast.log
            v106_summary.json
            v106_trades.csv
          if-no-files-found: warn
